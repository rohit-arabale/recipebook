<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/fa-utensils.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>recipebook • Discover & Share Amazing Recipes</title>
    <meta
      name="description"
      content="Create, save, and discover delicious recipes from food lovers around the world."
    />

    <meta name="theme-color" content="#f97316" />

    <!-- Google Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="recipebook • Discover & Share Amazing Recipes"
    />
    <meta
      property="og:description"
      content="Share your favorite recipes and discover new dishes from the community."
    />
    <meta property="og:type" content="website" />

    <!-- Smooth App Loading -->
    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, #fff7ed 0%, transparent 35%),
          radial-gradient(circle at top right, #eef2ff 0%, transparent 35%),
          linear-gradient(to bottom, #f8fafc, #ffffff);

        font-family: Inter, sans-serif;
      }

      #loader {
        position: fixed;
        inset: 0;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background:
          radial-gradient(circle at top left, #fff7ed 0%, transparent 35%),
          radial-gradient(circle at top right, #eef2ff 0%, transparent 35%),
          linear-gradient(to bottom, #f8fafc, #ffffff);

        z-index: 9999;
      }

      .loader-logo {
        font-size: 3rem;
        margin-bottom: 12px;
        animation: float 2s ease-in-out infinite;
      }

      .loader-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: #0f172a;
      }

      .loader-subtitle {
        color: #64748b;
        margin-top: 4px;
      }

      .spinner {
        margin-top: 20px;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(249, 115, 22, 0.2);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>

  <body>
    <div id="loader">
      <div class="loader-logo">🍽️</div>
      <div class="loader-title">recipebook</div>
      <div class="loader-subtitle">Cooking up something delicious...</div>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("loader");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.4s ease";

          setTimeout(() => {
            loader.remove();
          }, 400);
        }
      });
    </script>
  </body>
</html>
